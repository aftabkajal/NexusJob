name: CI

# On a PR branch, only the pull_request event runs the pipeline; push is scoped to
# main so a branch with an open PR does not build everything twice (the two events
# have different concurrency groups and would not cancel each other).
on:
  push:
    branches: [main]
  pull_request:

# Every gate runs here; any step that fails, fails the run (AR-13).
# No container-registry push and no deploy step (no hosting platform chosen).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + architecture tests
    runs-on: ubuntu-latest
    # 20 (was 15): NexusJob.IntegrationTests pulls postgres:18 via Testcontainers
    # and runs PBKDF2 hashing; ubuntu-latest has Docker preinstalled.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build backend/NexusJob.sln --configuration Release

      - name: Test (SM-2 boundary gate + Host /health + Identity integration tests)
        run: dotnet test backend/NexusJob.sln --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (FSD boundary gate)
        run: npm run lint

      - name: FSD boundary gate (negative test)
        run: npm run test:fsd-gate

      - name: API client import gate (negative test)
        run: npm run test:api-import-gate

      - name: Lint (design-token gate)
        run: npm run lint:tokens

      - name: Design-token gate (negative test)
        run: npm run test:tokens-gate

      - name: Unit tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: No self-hosted-font regressions (no Google Fonts requests)
        run: |
          if grep -rIn -e 'fonts\.googleapis\.com' -e 'fonts\.gstatic\.com' dist; then
            echo "::error::built assets reference an external Google Fonts host; Inter must stay self-hosted"
            exit 1
          fi

  openapi-client:
    name: OpenAPI 3.0 doc + NSwag client drift gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Build-time OpenAPI emission (Microsoft.Extensions.ApiDescription.Server)
      # writes backend/NexusJob.Host/openapi/NexusJob.Host.json - the untracked
      # input NSwag reads. Only the generated TS client is committed.
      - name: Build Host (emits the OpenAPI 3.0 document)
        run: dotnet build backend/NexusJob.Host/NexusJob.Host.csproj --configuration Release

      - name: Assert the emitted document is OpenAPI 3.0
        run: |
          doc=backend/NexusJob.Host/openapi/NexusJob.Host.json
          if [ ! -f "$doc" ]; then
            echo "::error::$doc was not emitted by the Host build."
            exit 1
          fi
          version=$(jq -r '.openapi // empty' "$doc")
          case "$version" in
            3.0.*) echo "OpenAPI document version: $version" ;;
            *) echo "::error::$doc has openapi '$version'; expected 3.0.* (NSwag's TS generator is unreliable on 3.1)."; exit 1 ;;
          esac

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Regenerate the TypeScript API client
        working-directory: frontend
        run: npm run generate:api

      - name: Fail on client drift
        working-directory: frontend
        run: |
          git add -N -- src/shared/api
          if ! git diff --exit-code -- src/shared/api; then
            echo "::error::The committed frontend/src/shared/api client is stale. Run 'npm run generate:api' (after a Host build) and commit the result."
            exit 1
          fi

  image:
    name: Container image build + smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push, no deploy)
        run: docker compose build

      - name: Smoke test (/health + same-origin serve)
        run: |
          set -euo pipefail
          docker compose up -d
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8080/health || true)
            if [ "$code" = "200" ] && grep -q '"database":"ok"' /tmp/health.json; then ok=1; break; fi
            sleep 5
          done
          root=$(curl -s -o /tmp/root.html -w '%{http_code}' http://localhost:8080/ || true)
          echo "health=$code root=$root"
          docker compose logs --no-color app || true
          docker compose down -v || true
          if [ "$ok" != "1" ]; then echo "::error::/health never returned 200 {\"database\":\"ok\"}"; exit 1; fi
          if [ "$root" != "200" ]; then echo "::error::SPA index.html not served from the app origin"; exit 1; fi
